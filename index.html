<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopShop WiFi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        .wifi-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            font-weight: 600;
        }
        .value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
            font-family: 'Courier New', monospace;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }
        #qrcode img {
            border-radius: 12px;
            padding: 10px;
            background: white;
            border: 2px solid #e0e0e0;
        }
        .hint {
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }
        .copy-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background: #0056b3;
        }
        .copy-btn.copied {
            background: #28a745;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="wifi-icon">📶</div>
        <h1>ShopShop WiFi</h1>
        <p class="subtitle">Scan the QR code or connect manually</p>
        
        <div class="info-box">
            <div class="info-row">
                <span class="label">Network</span>
                <span class="value" id="ssid">Loading...</span>
            </div>
            <div class="info-row">
                <span class="label">Password</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="value" id="password">Loading...</span>
                    <button class="copy-btn" onclick="copyPassword()">Copy</button>
                </div>
            </div>
        </div>

        <div id="qrcode"></div>
        
        <p class="hint">
            📱 <strong>iPhone/Android:</strong> Open Camera app and point at QR code<br>
            💻 <strong>Laptop:</strong> Use password above to connect manually
        </p>
    </div>

    <script>
        // Fetch config and generate QR
        fetch('wifi-config.json')
            .then(response => response.json())
            .then(config => {
                document.getElementById('ssid').textContent = config.ssid;
                document.getElementById('password').textContent = config.password;
                
                // Generate WiFi QR code: WIFI:T:WPA;S:SSID;P:PASSWORD;;
                const wifiString = `WIFI:T:WPA;S:${config.ssid};P:${config.password};;`;
                
                new QRCode(document.getElementById('qrcode'), {
                    text: wifiString,
                    width: 200,
                    height: 200,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
            })
            .catch(error => {
                console.error('Error loading config:', error);
                document.getElementById('ssid').textContent = 'Error';
                document.getElementById('password').textContent = 'Error';
            });

        function copyPassword() {
            const password = document.getElementById('password').textContent;
            navigator.clipboard.writeText(password).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
